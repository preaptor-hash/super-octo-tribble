<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRMS Test Page</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            padding: 40px;
            max-width: 800px;
            margin: 0 auto;
        }
        .status {
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .success { background: #d1fae5; border: 2px solid #10b981; }
        .error { background: #fee2e2; border: 2px solid #ef4444; }
        .info { background: #dbeafe; border: 2px solid #3b82f6; }
        pre {
            background: #f3f4f6;
            padding: 15px;
            border-radius: 4px;
            overflow: auto;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
        }
        button:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>
    <h1>🔍 HRMS Application Diagnostics</h1>
    
    <div id="status" class="status info">
        <h2>Running diagnostics...</h2>
        <p>Please wait while we check your application.</p>
    </div>

    <div id="details"></div>

    <div style="margin-top: 30px;">
        <button onclick="window.location.href='/'">Go to App</button>
        <button onclick="location.reload()">Rerun Tests</button>
        <button onclick="testSupabase()">Test Supabase Connection</button>
    </div>

    <script type="module">
        const statusDiv = document.getElementById('status');
        const detailsDiv = document.getElementById('details');
        
        function showStatus(type, title, message) {
            statusDiv.className = `status ${type}`;
            statusDiv.innerHTML = `<h2>${title}</h2><p>${message}</p>`;
        }

        function addDetail(title, content, isError = false) {
            const detail = document.createElement('div');
            detail.className = `status ${isError ? 'error' : 'success'}`;
            detail.innerHTML = `<h3>${title}</h3><pre>${content}</pre>`;
            detailsDiv.appendChild(detail);
        }

        async function runDiagnostics() {
            try {
                // Check 1: Environment variables
                const supabaseUrl = import.meta.env.VITE_SUPABASE_URL;
                const supabaseKey = import.meta.env.VITE_SUPABASE_ANON_KEY;
                
                if (!supabaseUrl || !supabaseKey) {
                    showStatus('error', '❌ Configuration Error', 'Supabase credentials are missing from .env file');
                    addDetail('Environment Variables', `VITE_SUPABASE_URL: ${supabaseUrl ? '✓ Set' : '✗ Missing'}\nVITE_SUPABASE_ANON_KEY: ${supabaseKey ? '✓ Set' : '✗ Missing'}`, true);
                    return;
                }

                addDetail('✓ Environment Variables', `VITE_SUPABASE_URL: ${supabaseUrl}\nVITE_SUPABASE_ANON_KEY: ${supabaseKey.substring(0, 20)}...`);

                // Check 2: Try to import Supabase
                try {
                    const { createClient } = await import('@supabase/supabase-js');
                    addDetail('✓ Supabase Library', 'Successfully imported @supabase/supabase-js');
                    
                    // Check 3: Create client
                    const supabase = createClient(supabaseUrl, supabaseKey);
                    addDetail('✓ Supabase Client', 'Client created successfully');

                    // Check 4: Test connection
                    const { data, error } = await supabase.from('users').select('count', { count: 'exact', head: true });
                    
                    if (error) {
                        showStatus('error', '❌ Database Connection Failed', error.message);
                        addDetail('Database Error', JSON.stringify(error, null, 2), true);
                    } else {
                        showStatus('success', '✅ All Systems Operational', 'Your HRMS application is configured correctly!');
                        addDetail('✓ Database Connection', 'Successfully connected to Supabase database');
                    }
                } catch (importError) {
                    showStatus('error', '❌ Import Error', 'Failed to load Supabase library');
                    addDetail('Import Error', importError.toString(), true);
                }

            } catch (error) {
                showStatus('error', '❌ Diagnostic Failed', error.message);
                addDetail('Error Details', error.stack || error.toString(), true);
            }
        }

        window.testSupabase = async function() {
            detailsDiv.innerHTML = '';
            showStatus('info', '🔄 Testing Supabase...', 'Checking database connection');
            await runDiagnostics();
        };

        // Run diagnostics on load
        runDiagnostics();
    </script>
</body>
</html>
